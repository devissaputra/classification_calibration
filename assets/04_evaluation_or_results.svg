<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Evaluation Results</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Metrics generated from the included real-data experiment.</text>
<rect x="65" y="185" width="330" height="340" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="105" y="235" font-family="Arial" font-size="23" font-weight="700" fill="#1e40af">Discrimination</text>
<text x="105" y="320" font-family="Arial" font-size="66" font-weight="700" fill="#0f172a">0.9977</text>
<text x="105" y="362" font-family="Arial" font-size="24" fill="#475569">ROC-AUC</text>
<text x="105" y="430" font-family="Arial" font-size="20" fill="#64748b">Measures ranking quality</text>
<rect x="435" y="185" width="330" height="340" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="475" y="235" font-family="Arial" font-size="23" font-weight="700" fill="#166534">Classification</text>
<text x="475" y="320" font-family="Arial" font-size="66" font-weight="700" fill="#0f172a">0.9860</text>
<text x="475" y="362" font-family="Arial" font-size="24" fill="#475569">Accuracy</text>
<text x="475" y="430" font-family="Arial" font-size="20" fill="#64748b">Thresholded class decisions</text>
<rect x="805" y="185" width="330" height="340" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="845" y="235" font-family="Arial" font-size="23" font-weight="700" fill="#9a3412">Probability quality</text>
<text x="845" y="320" font-family="Arial" font-size="66" font-weight="700" fill="#0f172a">0.0181</text>
<text x="845" y="362" font-family="Arial" font-size="24" fill="#475569">Brier score</text>
<text x="845" y="430" font-family="Arial" font-size="20" fill="#64748b">Lower is better</text>
<rect x="250" y="565" width="700" height="65" rx="17" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
<text x="600" y="605" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#155e75">Interpretation requires both ranking performance and probability reliability.</text>
</svg>