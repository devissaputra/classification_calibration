<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Model &amp; Probability View</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">The model produces both a class decision and a probability estimate.</text>
<rect x="65" y="175" width="300" height="390" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="95" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#1e40af">Input feature space</text>
<g font-family="Arial" font-size="19" fill="#334155"><text x="100" y="270">• radius</text><text x="100" y="307">• texture</text><text x="100" y="344">• perimeter</text><text x="100" y="381">• area</text><text x="100" y="418">• smoothness</text><text x="100" y="455">• compactness</text><text x="100" y="492">• symmetry and others</text></g>
<rect x="450" y="175" width="300" height="390" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#166534">Probabilistic classifier</text>
<circle cx="600" cy="340" r="90" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
<text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">P(y=1|x)</text>
<text x="600" y="368" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">0.00 → 1.00</text>
<text x="600" y="490" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">P(benign), not malignancy risk</text>
<rect x="835" y="175" width="300" height="390" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="865" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#7e22ce">Two questions</text>
<rect x="880" y="285" width="210" height="85" rx="14" fill="#f3e8ff"/><text x="985" y="323" text-anchor="middle" font-family="Arial" font-size="20" fill="#581c87">Can it rank cases?</text><text x="985" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#581c87">ROC-AUC</text>
<rect x="880" y="405" width="210" height="85" rx="14" fill="#fff7ed"/><text x="985" y="443" text-anchor="middle" font-family="Arial" font-size="20" fill="#9a3412">Does 0.8 match data?</text><text x="985" y="470" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">Brier / calibration</text>
<path d="M365 365 H450" stroke="#2563eb" stroke-width="5"/><path d="M750 365 H835" stroke="#2563eb" stroke-width="5"/>
</svg>